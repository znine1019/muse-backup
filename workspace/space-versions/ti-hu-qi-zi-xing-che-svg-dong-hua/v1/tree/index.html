<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>鹈鹕骑自行车 SVG 动画</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2rem; }
    </style>
    <style>
      :root {
        --bg: #eaf3f6;
        --card: #ffffff;
        --ink: #22303a;
        --ink-soft: #5a6b76;
        --accent: #e8641c;
        --accent-ink: #ffffff;
        --line: #cfdde3;
        --chip: #eef4f6;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f161c;
          --card: #18222b;
          --ink: #e8f0f4;
          --ink-soft: #9db2bd;
          --line: #2c3d49;
          --chip: #22313d;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 1020px;
        margin: 0 auto;
        padding: 28px 18px 40px;
      }
      h1 {
        font-family: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: clamp(1.7rem, 5vw, 2.6rem);
        font-weight: 400;
        margin: 0 0 6px;
        letter-spacing: 0.02em;
      }
      .lede { margin: 0 0 20px; color: var(--ink-soft); font-size: 1rem; }
      .stage {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 10px;
        box-shadow: 0 10px 30px rgba(34, 48, 58, 0.08);
      }
      .stage svg { display: block; width: 100%; height: auto; border-radius: 10px; }
      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-top: 16px;
      }
      .controls .group {
        display: inline-flex;
        background: var(--chip);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px;
        gap: 4px;
      }
      button {
        font: inherit;
        font-size: 0.95rem;
        border: 1px solid transparent;
        background: transparent;
        color: var(--ink);
        border-radius: 999px;
        padding: 6px 16px;
        cursor: pointer;
        min-height: 2.25rem;
      }
      button:hover { border-color: var(--line); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button[aria-pressed="true"] {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
      }
      #playBtn {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
        font-weight: 600;
        padding: 6px 22px;
      }
      .hint { color: var(--ink-soft); font-size: 0.9rem; margin-left: auto; }
      .notes {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-top: 22px;
      }
      .notes section {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
      }
      .notes h2 {
        font-family: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
        font-weight: 400;
        font-size: 1.05rem;
        margin: 0 0 4px;
      }
      .notes p { margin: 0; color: var(--ink-soft); font-size: 0.92rem; }
      @media (max-width: 640px) {
        .notes { grid-template-columns: 1fr; }
        .hint { margin-left: 0; width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>鹈鹕骑自行车</h1>
      <p class="lede">一整幅会动的插画，全部由 SVG 图形和 SMIL 动画画成——没有图片，没有视频。车轮在转、脚踏在踩，连车筐里还装着一条鱼。</p>

      <div class="stage">
        <svg id="scene" viewBox="0 0 960 600" role="img" aria-labelledby="svgTitle svgDesc" xmlns="http://www.w3.org/2000/svg">
          <title id="svgTitle">鹈鹕骑自行车动画</title>
          <desc id="svgDesc">一只白鹈鹕蹬着一辆橙色自行车，沿着乡间小路骑行：车轮转动，双腿踩着脚踏，喉囊轻晃，红围巾飘动，背景的云朵、灌木和路面标线向后流动。</desc>

          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#8ecfeb" />
              <stop offset="0.65" stop-color="#c4e8f2" />
              <stop offset="1" stop-color="#e6f5ec" />
            </linearGradient>
            <clipPath id="frame">
              <rect x="0" y="0" width="960" height="600" rx="6" />
            </clipPath>
            <!-- 一个车轮，以原点为圆心，靠 use 摆到两个位置 -->
            <g id="wheel">
              <circle r="64" fill="#fdfdf8" fill-opacity="0.25" />
              <circle r="64" fill="none" stroke="#2f3542" stroke-width="10" />
              <circle r="53" fill="none" stroke="#c8d2da" stroke-width="3" />
              <g stroke="#9fb0bc" stroke-width="3">
                <line x1="-50" y1="0" x2="50" y2="0" />
                <line x1="-50" y1="0" x2="50" y2="0" transform="rotate(45)" />
                <line x1="-50" y1="0" x2="50" y2="0" transform="rotate(90)" />
                <line x1="-50" y1="0" x2="50" y2="0" transform="rotate(135)" />
              </g>
              <circle r="12" fill="#f39c3d" />
              <circle r="7" fill="#57606a" />
            </g>
            <!-- 一朵云 -->
            <g id="cloud" fill="#ffffff" opacity="0.92">
              <ellipse cx="0" cy="0" rx="46" ry="20" />
              <ellipse cx="-30" cy="6" rx="30" ry="15" />
              <ellipse cx="32" cy="7" rx="32" ry="14" />
            </g>
            <!-- 一丛灌木带小花，背景滚动单元（宽 960） -->
            <g id="bushRow">
              <g fill="#5da75d">
                <ellipse cx="90" cy="440" rx="52" ry="26" />
                <ellipse cx="330" cy="448" rx="40" ry="20" />
                <ellipse cx="560" cy="438" rx="58" ry="28" />
                <ellipse cx="800" cy="448" rx="44" ry="21" />
              </g>
              <g fill="#4c9450">
                <ellipse cx="200" cy="452" rx="30" ry="15" />
                <ellipse cx="680" cy="454" rx="28" ry="14" />
                <ellipse cx="920" cy="450" rx="34" ry="16" />
              </g>
              <g fill="#f6c453">
                <circle cx="80" cy="428" r="5" /><circle cx="345" cy="438" r="5" />
                <circle cx="548" cy="424" r="5" /><circle cx="812" cy="438" r="5" />
              </g>
              <g fill="#ef7d9b">
                <circle cx="112" cy="436" r="4" /><circle cx="575" cy="434" r="4" />
                <circle cx="788" cy="446" r="4" /><circle cx="205" cy="446" r="4" />
              </g>
            </g>
          </defs>

          <g clip-path="url(#frame)">
            <!-- 天空 -->
            <rect width="960" height="600" fill="url(#sky)" />

            <!-- 太阳与光芒 -->
            <g stroke="#f7b733" stroke-width="5" stroke-linecap="round" opacity="0.85">
              <g>
                <animateTransform attributeName="transform" type="rotate" from="0 838 92" to="360 838 92" dur="90s" repeatCount="indefinite" />
                <line x1="838" y1="22" x2="838" y2="38" />
                <line x1="838" y1="146" x2="838" y2="162" />
                <line x1="768" y1="92" x2="784" y2="92" />
                <line x1="892" y1="92" x2="908" y2="92" />
                <line x1="789" y1="43" x2="800" y2="54" />
                <line x1="876" y1="130" x2="887" y2="141" />
                <line x1="887" y1="43" x2="876" y2="54" />
                <line x1="800" y1="130" x2="789" y2="141" />
              </g>
            </g>
            <circle cx="838" cy="92" r="42" fill="#ffd93b" stroke="#f7b733" stroke-width="4" />

            <!-- 远山 -->
            <path d="M0 392 L0 308 Q150 246 310 302 Q420 340 540 296 Q700 240 820 292 Q900 322 960 300 L960 392 Z" fill="#a8cbb0" />
            <path d="M0 392 L0 344 Q220 292 430 338 Q640 380 960 330 L960 392 Z" fill="#8fbc97" />

            <!-- 漂移的云（两组首尾相接，无缝循环） -->
            <g>
              <animateTransform attributeName="transform" type="translate" values="0 0; -960 0" dur="80s" repeatCount="indefinite" />
              <use href="#cloud" transform="translate(150 96)" />
              <use href="#cloud" transform="translate(520 62) scale(0.7)" />
              <use href="#cloud" transform="translate(800 150) scale(1.25)" />
            </g>
            <g>
              <animateTransform attributeName="transform" type="translate" values="960 0; 0 0" dur="80s" repeatCount="indefinite" />
              <use href="#cloud" transform="translate(150 96)" />
              <use href="#cloud" transform="translate(520 62) scale(0.7)" />
              <use href="#cloud" transform="translate(800 150) scale(1.25)" />
            </g>

            <!-- 远处的小鸟 -->
            <g fill="none" stroke="#4a6b7a" stroke-width="3" stroke-linecap="round">
              <g>
                <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="2.4s" repeatCount="indefinite" />
                <path d="M196 150 q10 -9 20 0 q10 -9 20 0" />
                <path d="M262 182 q8 -7 16 0 q8 -7 16 0" />
              </g>
            </g>

            <!-- 草地 -->
            <rect x="0" y="392" width="960" height="78" fill="#79bd72" />
            <rect x="0" y="392" width="960" height="10" fill="#8fce84" />

            <!-- 滚动的灌木（中速视差） -->
            <g>
              <animateTransform attributeName="transform" type="translate" values="0 0; -960 0" dur="9s" repeatCount="indefinite" />
              <use href="#bushRow" />
            </g>
            <g>
              <animateTransform attributeName="transform" type="translate" values="960 0; 0 0" dur="9s" repeatCount="indefinite" />
              <use href="#bushRow" />
            </g>

            <!-- 路面 -->
            <rect x="0" y="470" width="960" height="130" fill="#7d766c" />
            <rect x="0" y="470" width="960" height="8" fill="#968d80" />
            <!-- 路面标线（快速滚动） -->
            <g fill="#f5efe0">
              <g>
                <animateTransform attributeName="transform" type="translate" values="0 0; -150 0" dur="0.5s" repeatCount="indefinite" />
                <rect x="0" y="528" width="78" height="9" rx="4" />
                <rect x="150" y="528" width="78" height="9" rx="4" />
                <rect x="300" y="528" width="78" height="9" rx="4" />
                <rect x="450" y="528" width="78" height="9" rx="4" />
                <rect x="600" y="528" width="78" height="9" rx="4" />
                <rect x="750" y="528" width="78" height="9" rx="4" />
                <rect x="900" y="528" width="78" height="9" rx="4" />
                <rect x="1050" y="528" width="78" height="9" rx="4" />
              </g>
            </g>

            <!-- 风线 -->
            <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none">
              <g opacity="0">
                <animate attributeName="opacity" values="0; 0.55; 0" dur="0.9s" repeatCount="indefinite" />
                <animateTransform attributeName="transform" type="translate" values="60 0; -240 0" dur="0.9s" repeatCount="indefinite" />
                <path d="M210 208 h74" />
              </g>
              <g opacity="0">
                <animate attributeName="opacity" values="0; 0.45; 0" dur="0.9s" begin="-0.35s" repeatCount="indefinite" />
                <animateTransform attributeName="transform" type="translate" values="60 0; -240 0" dur="0.9s" begin="-0.35s" repeatCount="indefinite" />
                <path d="M150 300 h58" />
              </g>
              <g opacity="0">
                <animate attributeName="opacity" values="0; 0.5; 0" dur="0.9s" begin="-0.6s" repeatCount="indefinite" />
                <animateTransform attributeName="transform" type="translate" values="60 0; -240 0" dur="0.9s" begin="-0.6s" repeatCount="indefinite" />
                <path d="M238 356 h52" />
              </g>
            </g>

            <!-- ============ 自行车 ============ -->
            <!-- 车轮 -->
            <g transform="translate(320 466)">
              <g>
                <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.05s" repeatCount="indefinite" />
                <use href="#wheel" />
              </g>
            </g>
            <g transform="translate(590 466)">
              <g>
                <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.05s" repeatCount="indefinite" />
                <use href="#wheel" />
              </g>
            </g>

            <!-- 链条 -->
            <g stroke="#4a4a4a" stroke-width="3">
              <line x1="450" y1="438" x2="320" y2="456" />
              <line x1="450" y1="466" x2="320" y2="476" />
            </g>

            <!-- 车架 -->
            <g stroke="#e4572e" stroke-width="8" stroke-linecap="round" fill="none">
              <line x1="450" y1="452" x2="320" y2="466" />
              <line x1="406" y1="362" x2="320" y2="466" />
              <line x1="450" y1="452" x2="406" y2="362" />
              <line x1="450" y1="452" x2="566" y2="364" />
              <line x1="410" y1="360" x2="562" y2="360" />
              <line x1="566" y1="364" x2="590" y2="466" />
              <line x1="562" y1="360" x2="556" y2="336" />
            </g>
            <!-- 车座与车把 -->
            <path d="M380 350 Q404 339 430 347 Q428 359 404 359 Q384 359 380 350 Z" fill="#5b4636" />
            <path d="M556 336 q-16 -8 -26 0 M556 336 q14 -9 24 -3" stroke="#3c4450" stroke-width="6" stroke-linecap="round" fill="none" />

            <!-- 远侧腿（相位差半圈，颜色稍深） -->
            <path fill="none" stroke="#dd8a26" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
              d="M420 330 L440 387 L420 452">
              <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
                keyTimes="0; 0.125; 0.25; 0.375; 0.5; 0.625; 0.75; 0.875; 1"
                values="M420 330 L440 387 L420 452;
                        M420 330 L445 377 L429 431;
                        M420 330 L455 372 L450 422;
                        M420 330 L466 377 L471 431;
                        M420 330 L470 387 L480 452;
                        M420 330 L466 398 L471 473;
                        M420 330 L455 402 L450 482;
                        M420 330 L445 398 L429 473;
                        M420 330 L440 387 L420 452" />
            </path>

            <!-- ============ 鹈鹕（身体随踩踏轻轻起伏） ============ -->
            <g id="pelican">
              <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="0.8s" repeatCount="indefinite" />

              <!-- 尾巴 -->
              <path d="M302 266 Q248 244 228 270 Q260 280 240 300 Q282 308 302 298 Z" fill="#e8edf1" stroke="#ccd4db" stroke-width="2" />

              <!-- 身体 -->
              <ellipse cx="388" cy="296" rx="98" ry="60" transform="rotate(-6 388 296)" fill="#ffffff" stroke="#d3dce2" stroke-width="2.5" />
              <ellipse cx="402" cy="314" rx="66" ry="36" transform="rotate(-6 402 314)" fill="#f2f6f8" />

              <!-- 翅膀（轻轻扇动） -->
              <g>
                <animateTransform attributeName="transform" type="rotate" values="-5 348 268; 7 348 268; -5 348 268" dur="1.6s" repeatCount="indefinite" />
                <path d="M330 252 Q420 238 448 298 Q404 348 336 332 Q314 292 330 252 Z" fill="#edf1f4" stroke="#c9d3da" stroke-width="2.5" />
                <path d="M344 282 Q396 272 424 300" fill="none" stroke="#c9d3da" stroke-width="2.5" stroke-linecap="round" />
              </g>

              <!-- 脖子（先描一层浅灰边，再盖白色） -->
              <path d="M458 274 C512 260 512 202 478 174" fill="none" stroke="#d3dce2" stroke-width="37" stroke-linecap="round" />
              <path d="M458 274 C512 260 512 202 478 174" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" />

              <!-- 红围巾：系带 + 飘动的一角 -->
              <g>
                <animateTransform attributeName="transform" type="rotate" values="-6 486 224; 8 486 224; -6 486 224" dur="0.8s" repeatCount="indefinite" />
                <path d="M486 226 Q438 214 408 236 Q444 246 488 244 Z" fill="#e74c3c" />
              </g>
              <path d="M484 206 Q514 216 524 242 L504 254 Q494 234 476 224 Z" fill="#e74c3c" />

              <!-- 头、喙、喉囊 -->
              <g>
                <animateTransform attributeName="transform" type="rotate" values="0 478 174; 2.5 478 174; 0 478 174" dur="1.6s" repeatCount="indefinite" />
                <path d="M454 152 Q440 134 452 128 Q464 138 464 150 Z" fill="#ffffff" stroke="#d3dce2" stroke-width="2" />
                <circle cx="474" cy="166" r="23" fill="#ffffff" stroke="#d3dce2" stroke-width="2.5" />
                <!-- 喉囊（轻晃） -->
                <g>
                  <animateTransform attributeName="transform" type="rotate" values="-2 497 182; 3 497 182; -2 497 182" dur="1.6s" repeatCount="indefinite" />
                  <path d="M498 180 Q566 234 644 192 Q600 198 556 193 Q520 189 498 180 Z" fill="#f8bd60" stroke="#e09a35" stroke-width="2" />
                </g>
                <!-- 长喙 -->
                <path d="M494 154 L650 190 L496 183 Q491 167 494 154 Z" fill="#f39c3d" stroke="#dd8627" stroke-width="2" />
                <circle cx="484" cy="160" r="3.6" fill="#26303a" />
                <circle cx="485.5" cy="158.5" r="1.2" fill="#ffffff" />
              </g>
            </g>

            <!-- 近侧腿 -->
            <path fill="none" stroke="#f5a83d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
              d="M420 330 L470 387 L480 452">
              <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
                keyTimes="0; 0.125; 0.25; 0.375; 0.5; 0.625; 0.75; 0.875; 1"
                values="M420 330 L470 387 L480 452;
                        M420 330 L466 398 L471 473;
                        M420 330 L455 402 L450 482;
                        M420 330 L445 398 L429 473;
                        M420 330 L440 387 L420 452;
                        M420 330 L445 377 L429 431;
                        M420 330 L455 372 L450 422;
                        M420 330 L466 377 L471 431;
                        M420 330 L470 387 L480 452" />
            </path>

            <!-- 曲柄、脚踏与脚掌（和双腿同周期旋转） -->
            <g transform="translate(450 452)">
              <g>
                <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite" />
                <circle r="17" fill="none" stroke="#57606a" stroke-width="5" />
                <line x1="-30" y1="0" x2="30" y2="0" stroke="#3c4450" stroke-width="6" stroke-linecap="round" />
                <rect x="24" y="-4" width="16" height="7" rx="3" fill="#3c4450" />
                <rect x="-40" y="-4" width="16" height="7" rx="3" fill="#3c4450" />
                <circle cx="34" cy="0" r="10" fill="#f39c3d" stroke="#d9822b" stroke-width="2" />
                <circle cx="-34" cy="0" r="10" fill="#dd8a26" stroke="#c2741d" stroke-width="2" />
                <circle r="5.5" fill="#3c4450" />
              </g>
            </g>

            <!-- 前车筐和一条鱼 -->
            <g>
              <path d="M604 366 Q610 338 632 342 Q626 358 630 368 Z" fill="#7fb3c8" stroke="#5d93a8" stroke-width="2" />
              <circle cx="622" cy="350" r="2.2" fill="#26303a" />
              <polygon points="590,368 648,368 638,412 598,412" fill="#c98d4b" stroke="#a96f35" stroke-width="2.5" />
              <g stroke="#a96f35" stroke-width="2">
                <line x1="594" y1="382" x2="644" y2="382" />
                <line x1="597" y1="396" x2="641" y2="396" />
              </g>
            </g>

            <!-- 点击鹈鹕时冒出的叫声气泡 -->
            <g opacity="0" transform="translate(668 108)">
              <animate id="honkAnim" attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.15; 0.75; 1" dur="1.4s" begin="indefinite" />
              <rect x="-34" y="-34" width="140" height="46" rx="14" fill="#ffffff" stroke="#d3dce2" stroke-width="2" />
              <path d="M-2 12 L-8 26 L12 12 Z" fill="#ffffff" stroke="#d3dce2" stroke-width="2" />
              <text x="36" y="1" text-anchor="middle" font-size="20" fill="#e8641c" font-family="'ZCOOL KuaiLe','PingFang SC',sans-serif">嘎——！</text>
            </g>

            <!-- 点击热区（盖住鹈鹕） -->
            <rect id="hitArea" x="215" y="110" width="450" height="260" fill="#ffffff" opacity="0" style="cursor:pointer" />
          </g>
        </svg>
      </div>

      <div class="controls">
        <button id="playBtn" type="button" aria-pressed="false">暂停</button>
        <span class="group" role="group" aria-label="播放速度">
          <button type="button" class="speedBtn" data-speed="0.5" aria-pressed="false">慢速</button>
          <button type="button" class="speedBtn" data-speed="1" aria-pressed="true">常速</button>
          <button type="button" class="speedBtn" data-speed="2" aria-pressed="false">快速</button>
        </span>
        <span class="hint">小提示：点一下画面里的鹈鹕，它会叫一声。</span>
      </div>

      <div class="notes">
        <section>
          <h2>踩踏是真同步的</h2>
          <p>双腿的路径动画和曲柄旋转共用 1.6 秒周期、相位差半圈，脚掌始终落在脚踏上，不是各动各的。</p>
        </section>
        <section>
          <h2>三层视差背景</h2>
          <p>云朵 80 秒漂移一圈、灌木 9 秒、路面标线 0.5 秒——速度不同，骑行的纵深感就出来了。</p>
        </section>
        <section>
          <h2>纯 SVG 实现</h2>
          <p>所有图形都是矢量元素，动画用 SMIL 驱动；暂停和变速通过 SVG 自带的时间轴接口控制。</p>
        </section>
      </div>
    </main>

    <script>
      (function () {
        var svg = document.getElementById('scene');
        var playBtn = document.getElementById('playBtn');
        var paused = false;

        function setPaused(next) {
          paused = next;
          if (paused) {
            svg.pauseAnimations();
            playBtn.textContent = '播放';
            playBtn.setAttribute('aria-pressed', 'true');
          } else {
            svg.unpauseAnimations();
            playBtn.textContent = '暂停';
            playBtn.setAttribute('aria-pressed', 'false');
          }
        }

        playBtn.addEventListener('click', function () { setPaused(!paused); });

        // 记录每个动画的原始时长，变速时按比例改写并统一重启，保持彼此同步
        var anims = [];
        var nodes = svg.querySelectorAll('animate, animateTransform');
        for (var i = 0; i < nodes.length; i++) {
          var el = nodes[i];
          if (el.getAttribute('begin') === 'indefinite') continue;
          anims.push({ el: el, base: parseFloat(el.getAttribute('dur')) });
        }

        var speedBtns = document.querySelectorAll('.speedBtn');
        speedBtns.forEach(function (btn) {
          btn.addEventListener('click', function () {
            var factor = parseFloat(btn.getAttribute('data-speed'));
            anims.forEach(function (a) {
              a.el.setAttribute('dur', (a.base / factor) + 's');
              try { a.el.beginElement(); } catch (e) {}
            });
            speedBtns.forEach(function (b) { b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
          });
        });

        // 点鹈鹕：冒出叫声气泡
        document.getElementById('hitArea').addEventListener('click', function () {
          try { document.getElementById('honkAnim').beginElement(); } catch (e) {}
        });

        // 遵循系统的“减少动态效果”设置：默认先暂停
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          setPaused(true);
        }
      })();
    </script>
  </body>
</html>
